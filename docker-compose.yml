services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkdev}
      POSTGRES_USER: ${POSTGRES_USER:-linkdev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkdev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-linkdev}:${POSTGRES_PASSWORD:-linkdev}@db:5432/${POSTGRES_DB:-linkdev}
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY:-change-this-development-secret-key-before-production}
      ALLOWED_HOSTS: localhost,127.0.0.1
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      SECURE_SSL_REDIRECT: "False"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
